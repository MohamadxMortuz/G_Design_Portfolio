name: CI - Build Validation

on:
  push:
    branches:
      -main:

jobs:
  build:
  name: Install and Build
  runs-on: ubuntu-latest

  steps:
    -name:checkout Repository
    uses: actions/checkout@v2

    -name: setup Node.js
    uses: actions/setup-node@v2
    with:
      node-version: '18'
      cache: 'npm'

      -name: Install Dependencies
      run: npm install

      -name: Build Project
      run: npm run build
