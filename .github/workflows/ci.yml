name: CI - Build Validation

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout the repository code ──────────────
      # Pulls your latest code into the GitHub Actions runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Setup Node.js v18 ─────────────────────────
      # Installs Node.js and enables npm caching for faster runs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # ── Step 3: Install dependencies ──────────────────────
      # Installs all packages from package.json
      - name: Install Dependencies
        run: npm install

      # ── Step 4: Run production build ──────────────────────
      # Runs `vite build` via npm run build
      # If TypeScript errors or build failures exist, this step fails
      - name: Build Project
        run: npm run build
